version: 2
updates:
  # npm dependencies: one grouped PR per week against dev, security fixes as soon as published.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      all-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 3

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
