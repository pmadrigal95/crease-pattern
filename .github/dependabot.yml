version: 2
updates:
  # npm dependencies, weekly against development. Minor and patch updates arrive as one
  # grouped PR; each major update gets its own PR so a breaking package never
  # blocks the safe ones. Security updates are separate and ignore these rules.
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # astro check does not support TypeScript 7 yet. Remove this rule once
      # @astrojs/check lists typescript 7 in its peer dependencies.
      - dependency-name: typescript
        versions: ['>=7']
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
