name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json → packageManager; Node from .node-version.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm check
      - name: Unit tests (tokens contrast in 3 identities × 2 themes)
        run: pnpm test
      - name: Build
        run: pnpm build

      - name: Accessibility (axe in every identity and theme)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Lighthouse budgets
        run: pnpm lighthouse
