name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
permissions:
  contents: read

jobs:
  quality:
    # Pinned, not ubuntu-latest: the image moved to 26.04, where Playwright's system packages
    # failed to install. Moving to a new image is a reviewed change, not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the Inspector manifest reads each file's last change from git.
          fetch-depth: 0

      # pnpm version comes from package.json → packageManager; Node from .node-version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Generated sources (tokens CSS, Inspector manifest) the type check and tests read.
      - run: pnpm generate

      - name: Workflow policy (SHA pins, no persisted credentials, protected deploy)
        run: pnpm check:workflows
      - name: File sizes (media lives in R2, not git)
        run: pnpm check:sizes
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm check
      - name: Unit tests (tokens contrast in 3 identities × 2 themes)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Worker bundles (dry run, nothing is deployed)
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: JavaScript budgets (page and on-demand, Brotli)
        run: pnpm check:budgets

      - name: Accessibility (axe in every identity and theme)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Lighthouse budgets
        run: pnpm lighthouse

      # Last, because it rebuilds dist/ as a preview (drafts included): interactive essays run
      # end to end with real Web Workers, then their JavaScript is checked against its budget.
      - name: Interactive essays (preview build, end to end and budget)
        run: |
          pnpm test:e2e:essay
          pnpm check:budgets
