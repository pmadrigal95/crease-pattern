name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json → packageManager; Node from .node-version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens

      - name: Workflow policy (SHA pins, no persisted credentials, protected deploy)
        run: pnpm check:workflows
      - name: File sizes (media lives in R2, not git)
        run: pnpm check:sizes
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm check
      - name: Unit tests (tokens contrast in 3 identities × 2 themes)
        run: pnpm test
      - name: Build
        run: pnpm build

      - name: Accessibility (axe in every identity and theme)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Lighthouse budgets
        run: pnpm lighthouse
