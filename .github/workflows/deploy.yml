name: Deploy

on:
  push:
    branches: [main]
  # Manual re-deploy of main; the jobs below refuse any other ref.
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# One production deploy at a time, in order, and never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
jobs:
  # Builds the site without any secret. Dependency code (Astro, Vite, MDX, the token script)
  # runs only in this job, never next to the Cloudflare token.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  # Publishes exactly the artifact built above. The Cloudflare secrets live in the `production`
  # environment, whose deployment-branch policy (set in GitHub) only admits main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Same version as the lockfile, so the deploy CLI is pinned too.
          wranglerVersion: '4.152.0'
          command: deploy
