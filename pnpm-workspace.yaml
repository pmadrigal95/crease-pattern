allowBuilds:
  esbuild: true
  workerd: true

# rolldown's WebAssembly binding pulls in the emnapi 2.0 beta, and pnpm then hands that beta to
# @astrojs/check, which crashes against the 1.x core it ships with (astro check fails in CI).
# Pin both to the stable 1.x line until @astrojs/check supports 2.0.
overrides:
  '@emnapi/runtime': 1.11.3
  '@emnapi/core': 1.11.3
  # minimatch 10.x (pulled in by ESLint and its plugins, development only) has a denial-of-service
  # advisory fixed in 11.0.1; Dependabot can't lift it through the ESLint ranges, so pin it here.
  'minimatch@>=10 <11': ^11.0.5
  # basic-ftp 5.x (Lighthouse CI → proxy-agent → get-uri, development only, used just for ftp:// URLs
  # that this project never fetches) has a denial-of-service advisory fixed in 6.2.4; get-uri still
  # asks for ^5, so Dependabot can't lift it. Pin it here.
  'basic-ftp@<6.2.4': ^6.2.4
